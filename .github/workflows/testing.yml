name: Testing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron:  '17 1 * * *' # Run every day on a seemly random time.

jobs:
  test:
    uses: wp-cli/.github/.github/workflows/reusable-testing.yml@main
    with:
      # Site Health was introduced in WordPress 5.2, which is what the command
      # requires. The default base matrix rewrites its 4.9 entry to this value.
      minimum-wp: 5.2
      # The command spans several WordPress versions, so test each boundary:
      # 5.1 is below the requirement and must report it, WP_Site_Health::get_instance()
      # arrives in 5.4, and the authorization header check in 5.6. 5.2 itself comes
      # from minimum-wp above, and 5.6 and later are also covered by latest and trunk.
      matrix: >-
        {
          "include": [
            { "php": "7.2", "wp": "5.1", "mysql": "mysql-5.6" },
            { "php": "7.2", "wp": "5.4", "mysql": "mysql-5.6" },
            { "php": "7.2", "wp": "5.6", "mysql": "mysql-5.6" }
          ]
        }
