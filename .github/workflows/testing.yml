name: Testing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron:  '17 1 * * *' # Run every day on a seemly random time.

jobs:
  test:
    uses: wp-cli/.github/.github/workflows/reusable-testing.yml@main
    with:
      # This command spans several WordPress versions, so test each boundary. The
      # default minimum of 4.9 is below the WordPress 5.2 the command requires, and
      # covers the version check reporting itself. Of the rest, 5.2 exercises the
      # direct `new WP_Site_Health()`, 5.4 `WP_Site_Health::get_instance()`, and 5.6
      # `WP_Site_Health::get_test_authorization_header()`. 5.6 and later are also
      # covered by latest and trunk.
      matrix: >-
        {
          "include": [
            { "php": "7.2", "wp": "5.2", "mysql": "mysql-5.6" },
            { "php": "7.2", "wp": "5.4", "mysql": "mysql-5.6" },
            { "php": "7.2", "wp": "5.6", "mysql": "mysql-5.6" }
          ]
        }
